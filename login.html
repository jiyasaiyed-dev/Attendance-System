{% extends "base.html" %}
{% block title %}Login - AI Attendance System{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-box">
        <h1>📋 AI Attendance System</h1>
        <p class="subtitle">Admin Login</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="password" required style="padding-right:40px;">
                    <span onclick="togglePassword()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px; user-select:none;" id="eyeIcon">👁</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.textContent = '🙈';
            } else {
                pwd.type = 'password';
                eye.textContent = '👁';
            }
        }
        </script>
    </div>
</div>
{% endblock %}
