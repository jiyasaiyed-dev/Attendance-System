{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'Add' }} Student{% endblock %}
{% block content %}

<div class="page-header">
    <h2>{{ 'Edit Student' if student else 'Add New Student' }}</h2>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">← Back to Students</a>
</div>

<div class="card" style="max-width:640px;">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Roll No *</label>
                <input type="text" name="roll_no" required value="{{ student.roll_no if student else '' }}">
            </div>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" required value="{{ student.name if student else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course" value="{{ student.course if student else '' }}">
            </div>
            <div class="form-group">
                <label>Semester</label>
                <input type="text" name="semester" value="{{ student.semester if student else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ student.email if student else '' }}">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ student.phone if student else '' }}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">{{ 'Update Student' if student else 'Add Student' }}</button>
    </form>
</div>

{% endblock %}
